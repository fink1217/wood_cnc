<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>顏料罐木架產生器</title>
  <link rel="stylesheet" href="src/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <!-- 畫面上的直覺操作：視角、顯示、爆炸圖、提示 -->
  <div id="toolbar" role="toolbar" aria-label="檢視">
    <div class="seg">
      <button id="view-front" title="正視">正視</button>
      <button id="view-iso" title="等角">等角</button>
      <button id="view-side" title="側視">側視</button>
    </div>
    <label class="tool-toggle"><input type="checkbox" id="show-cans" checked /><span>罐子</span></label>
    <label class="tool-toggle"><input type="checkbox" id="show-dims" checked /><span>尺寸</span></label>
    <label class="tool-range"><span>爆炸</span><input type="range" id="explode" min="0" max="1" step="0.01" value="0" /></label>
  </div>
  <div id="hint" aria-live="polite"></div>
  <div id="tooltip" hidden></div>
  <div id="inspector" hidden aria-live="polite"></div>

  <button id="sidebar-toggle" aria-controls="sidebar" aria-expanded="true" title="收合側欄">
    <span class="when-open">收合 ›</span><span class="when-closed">‹ 展開側欄</span>
  </button>

  <aside id="sidebar">
    <header>
      <h1>顏料罐木架</h1>
      <div id="summary"></div>
      <div id="warnings"></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="design">設計</button>
        <button role="tab" data-tab="signs">名牌</button>
        <button role="tab" data-tab="mounts">掛點</button>
        <button role="tab" data-tab="output">材料</button>
      </nav>
    </header>

    <div class="panel" data-panel="design">
      <section id="params"></section>
      <section>
        <h2>多架組裝</h2>
        <div id="assembly" class="param-block"></div>
      </section>
    </div>

    <div class="panel" data-panel="signs">
      <section id="nameplate"></section>
    </div>

    <div class="panel" data-panel="mounts">
      <section>
        <div class="row-buttons">
          <button id="mount-add">新增掛點</button>
          <button id="mount-auto">每模組 2 個</button>
          <button id="mount-clear" class="ghost">全部清除</button>
        </div>
        <div id="mount-edit"></div>
        <div id="mount-list"></div>
        <div id="mount-pairs"></div>
      </section>
    </div>

    <div class="panel" data-panel="output">
      <section>
        <div class="row-buttons">
          <button id="export-zip" class="primary">全部打包 ZIP</button>
          <button id="export-dxf">DXF</button>
          <button id="export-svg">SVG</button>
          <button id="export-bom">CSV</button>
          <button id="export-json">JSON</button>
          <label class="button ghost">匯入 JSON<input type="file" id="import-json" accept="application/json" hidden /></label>
        </div>
        <p class="hint" id="layout-info"></p>
        <p id="export-msg"></p>
      </section>
      <section id="connectors"></section>
      <section id="bom"></section>
      <section><button id="reset" class="ghost">恢復預設參數</button></section>
    </div>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
