name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/cnc-paint-can-rack-22d4jy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html src _site/
          touch _site/.nojekyll
          # 防快取：每次部署在 CSS、JS 與模組 import 加上版本號，瀏覽器才會載入新檔
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src/[A-Za-z0-9_-]+\.(js|css))\"#\1?v=$V\"#g" _site/index.html
          find _site/src -name '*.js' -exec sed -i -E "s#(from '\.\.?/[A-Za-z0-9_/.-]+\.js)'#\1?v=$V'#g" {} +
          sed -i "s#<span class=\"ver\">dev</span>#<span class=\"ver\">$V</span>#" _site/index.html
          grep -rc "?v=$V" _site/index.html _site/src
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
